name: Android APK

# Builds the Lokal Android app (mobile/) and publishes the APKs on the
# "android-latest" pre-release, ready to download on the phone.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'server/**'
      - 'electron/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOKAL_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          # The desktop app's install scripts (Electron, native modules) aren't needed.
          npm ci --ignore-scripts --no-audit --no-fund
          cd mobile && npm ci --no-audit --no-fund

      - name: Build the interface, the server bundle and the shell
        working-directory: mobile
        run: npm run build

      - name: Test the server under the phone's Node.js limits (Node 18, no ICU)
        working-directory: mobile
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          bash scripts/make-test-music.sh "$RUNNER_TEMP/music"
          npm pack node-linux-x64@18.20.4 --silent --pack-destination "$RUNNER_TEMP" > /dev/null
          tar xzf "$RUNNER_TEMP/node-linux-x64-18.20.4.tgz" -C "$RUNNER_TEMP"
          node scripts/smoke-test.mjs "$RUNNER_TEMP/music" "$RUNNER_TEMP/package/bin/node"

      - name: For you + SpotiFLAC with the real network (report)
        working-directory: mobile
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node -r ./scripts/simulate-android.cjs -r ./backend/polyfills.js scripts/discover-mixes.test.cjs
            node scripts/network-check.mjs "$RUNNER_TEMP/music" "$RUNNER_TEMP/package/bin/node"
          } 2>&1 | tee "$GITHUB_WORKSPACE/network-report.txt"

      - name: Version
        run: |
          version=$(node -p "require('./mobile/package.json').version")
          echo "LOKAL_VERSION_NAME=${version}-android.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Signing key (optional, from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.LOKAL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LOKAL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOKAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LOKAL_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lokal.keystore"
            {
              echo "LOKAL_KEYSTORE_FILE=$RUNNER_TEMP/lokal.keystore"
              echo "LOKAL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "LOKAL_KEY_ALIAS=$KEY_ALIAS"
              echo "LOKAL_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with your own key."
          else
            echo "No LOKAL_KEYSTORE_BASE64 secret: signing with the project's shared key."
          fi

      - name: Build the APKs
        working-directory: mobile
        run: |
          npx cap sync android
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect
        run: |
          mkdir -p out
          for apk in mobile/android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-(.*)-release$/\1/')
            cp "$apk" "out/Lokal-${LOKAL_VERSION_NAME}-${abi}.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: lokal-android-${{ env.LOKAL_VERSION_NAME }}
          path: out/*.apk

      - name: Publish on the android-latest pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Lokal pour Android, build ${LOKAL_VERSION_NAME} ($(git rev-parse --short HEAD)).
          
          Quel fichier ? La plupart des téléphones : **arm64-v8a**. Anciens téléphones 32 bits : armeabi-v7a. Émulateurs / Chromebooks : x86_64."
          gh release view android-latest > /dev/null 2>&1 || gh release create android-latest --prerelease --title "Lokal Android" --notes "$notes" --target "$GITHUB_SHA"
          git tag -f android-latest "$GITHUB_SHA" && git push -f origin refs/tags/android-latest
          gh release edit android-latest --prerelease --title "Lokal Android ${LOKAL_VERSION_NAME}" --notes "$notes"
          # Replace the previous APKs.
          for old in $(gh release view android-latest --json assets -q '.assets[].name'); do gh release delete-asset android-latest "$old" -y; done
          gh release upload android-latest out/*.apk --clobber
          if [ -f network-report.txt ]; then gh release upload android-latest network-report.txt --clobber; fi
